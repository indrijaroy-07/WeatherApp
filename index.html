<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather App</title><link rel="stylesheet" href="style.css"></head><body><header class="hero"><nav class="nav"><a href="index.html">Weather App</a><a href="README.md">Documentation</a></nav><div class="hero-content"><span class="eyebrow">Minor Project • REST API</span><h1>Live Weather</h1><p>Search any city to see its current weather conditions and details.</p></div></header><main class="container"><section class="card"><h2>Search Weather</h2><form id="weather-form" class="form"><input id="city" required placeholder="Enter city name"><button>Search Weather</button></form><div id="message" class="message" aria-live="polite"></div><article id="result" class="result hidden"><h2 id="location"></h2><p id="condition"></p><h1><span id="temp"></span>°C</h1><p><strong>Humidity:</strong> <span id="humidity"></span></p><p><strong>Wind Speed:</strong> <span id="wind"></span> km/h</p><p><strong>Feels Like:</strong> <span id="feels"></span>°C</p></article></section></main><footer>HTML5 • CSS3 • JavaScript ES6+ • Open-Meteo API</footer><script type="module" src="js/main.js"></script></body></html>
